// Reconstructed from Antigravity app bundle (jetskiAgent/main.js)
// Package: exa.language_server_pb
// LanguageServerService: The main ConnectRPC service for the Jetski agent.
// Contains ~120 methods for Cascade, completions, settings, browser, etc.

syntax = "proto3";

package exa.language_server_pb;

import "exa/cortex_pb.proto";
import "exa/jetski_cortex_pb.proto";
import "exa/reactive_component_pb.proto";
import "exa/chat_pb.proto";
import "exa/codeium_common_pb.proto";
