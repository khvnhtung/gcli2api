// ---------------------------------------------------------------------------
// MESSAGES
// ---------------------------------------------------------------------------

// Top-level model configuration (wraps generation + context check models)
message ModelConfig {
  ModelInfo generation_model = 1;
  ModelInfo context_check_model = 2;
}

// Full model metadata for a specific model instance
message ModelInfo {
  Model model_id = 1;                          // enum Model
  bool is_internal = 2;
  ModelType model_type = 3;                    // enum ModelType
  int32 max_tokens = 4;
  string tokenizer_type = 5;
  ModelFeatures model_features = 6;
  APIProvider api_provider = 7;                // enum APIProvider
  string model_name = 8;
  bool supports_context = 9;
  int32 embed_dim = 10;
  string base_url = 11;
  string chat_model_name = 12;
  int32 max_output_tokens = 13;
  PromptTemplaterType prompt_templater_type = 14;  // enum PromptTemplaterType
  ToolFormatterType tool_formatter_type = 15;      // enum ToolFormatterType
  int32 thinking_budget = 16;
  int32 min_thinking_budget = 17;
}

// Feature flags for model capabilities
message ModelFeatures {
  bool supports_context_tokens = 2;
  bool requires_instruct_tags = 3;
  bool requires_fim_context = 4;
  bool requires_context_snippet_prefix = 5;
  bool requires_context_relevance_tags = 6;
  bool requires_llama3_tokens = 7;
  bool zero_shot_capable = 8;
  bool requires_autocomplete_as_command = 9;
  bool supports_cursor_aware_supercomplete = 10;
  bool supports_images = 11;
  bool supports_tool_calls = 12;
  bool supports_cumulative_context = 13;
  bool tab_jump_print_line_range = 14;
  bool supports_thinking = 15;
  bool supports_estimate_token_counter = 17;
  bool add_cursor_to_find_replace_target = 18;
  bool supports_tab_jump_use_whole_document = 19;
  bool supports_raw_thinking = 21;
  bool supports_pdf = 22;
  bool supports_video = 23;
  bool supports_model_info_override = 24;
  bool requires_lead_in_generation = 25;
  bool requires_no_xml_tool_examples = 26;
  bool does_not_support_tool_choice = 27;
  map<string, bool> supported_mime_types = 28;
}

// Oneof wrapper: either a specific Model enum or a ModelAlias
message ModelOrAlias {
  oneof choice {
    Model model = 1;         // enum Model
    ModelAlias alias = 2;    // enum ModelAlias
  }
}

// Quota information for a model (e.g., remaining daily usage fraction)
message QuotaInfo {
  float remaining_fraction = 1;       // 0.0 - 1.0
  google.protobuf.Timestamp reset_time = 2;
}

// Client-facing model configuration (what users see in the UI)
message ClientModelConfig {
  string label = 1;                             // Display name
  ModelOrAlias model_or_alias = 2;              // Which model/alias this represents
  float credit_multiplier = 3;                  // Credits cost multiplier
  bool disabled = 4;
  bool supports_images = 5;
  bool supports_legacy = 6;
  bool is_premium = 7;
  string beta_warning_message = 8;
  bool is_beta = 9;
  ModelProvider provider = 10;                  // enum ModelProvider
  bool is_recommended = 11;
  repeated TeamsTier allowed_tiers = 12;        // Which subscription tiers can use this
  ModelPricingType pricing_type = 13;           // enum ModelPricingType
  string description = 14;
  QuotaInfo quota_info = 15;
  string tag_title = 16;
  string tag_description = 17;
  map<string, bool> supported_mime_types = 18;
}

// Sorting/grouping of models for UI display
message ClientModelSort {
  string name = 1;
  repeated ClientModelGroup groups = 2;
}

message ClientModelGroup {
  string group_name = 1;
  repeated string model_labels = 2;
}

// Default model override config
message DefaultOverrideModelConfig {
  ModelOrAlias model_or_alias = 1;
  string version_id = 2;
}

// Top-level cascade model configuration data (returned by server)
message CascadeModelConfigData {
  repeated ClientModelConfig client_model_configs = 1;
  repeated ClientModelSort client_model_sorts = 2;
  optional DefaultOverrideModelConfig default_override_model_config = 3;
}


